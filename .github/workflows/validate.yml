name: Validate catalog

on:
  pull_request:
    paths:
      - card_templates.json
      - validate_catalog.py
      - .github/workflows/validate.yml
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate card catalog
        run: python3 validate_catalog.py card_templates.json
